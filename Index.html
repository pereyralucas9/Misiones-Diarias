<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1424">
<title>Misiones Diarias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#0F1424;--sf:#1A2140;--sf2:#232C55;--tx:#EEF1FF;--mu:#9AA3C7;--amber:#FFB547;--teal:#3DDBB4;--coral:#FF6B6B;--r:22px;
--f:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#EEF4F1;--sf:#FFFFFF;--sf2:#DCE8E3;--tx:#14213D;--mu:#5B6B80;--amber:#D98200;--teal:#0E9F7E;--coral:#D94444;color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:var(--f);line-height:1.45;min-height:100%;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1}
.fecha{color:var(--mu);font-size:.95rem;margin-top:6px}
.ico{background:var(--sf);color:var(--tx);border:0;border-radius:14px;width:44px;height:44px;font-size:1.2rem;cursor:pointer}
.ico:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h2{font-size:1.05rem;font-weight:600;color:var(--mu);margin:30px 4px 12px}
.aviso{background:var(--sf2);color:var(--mu);border-radius:14px;padding:10px 14px;font-size:.85rem;margin-bottom:18px}
/* Misión principal: el farol */
.main{position:relative;background:var(--sf);border-radius:28px;padding:26px 22px;display:flex;gap:18px;align-items:center;overflow:hidden;
box-shadow:0 0 0 2px color-mix(in srgb,var(--amber) 45%,transparent),0 14px 50px -12px color-mix(in srgb,var(--amber) 55%,transparent)}
.main::before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;
background:radial-gradient(circle,color-mix(in srgb,var(--amber) 35%,transparent),transparent 65%);pointer-events:none;transition:opacity .6s}
.main.done::before{background:radial-gradient(circle,color-mix(in srgb,var(--teal) 40%,transparent),transparent 65%)}
.main.done{box-shadow:0 0 0 2px color-mix(in srgb,var(--teal) 55%,transparent),0 14px 50px -12px color-mix(in srgb,var(--teal) 55%,transparent)}
.main h3{margin:0;font-size:1.5rem;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.main .sub{color:var(--mu);font-size:.9rem;margin-top:6px}
.main.done h3{text-decoration:line-through;text-decoration-thickness:2px;opacity:.7}
.chk{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--amber);background:transparent;color:transparent;font-size:1.6rem;font-weight:800;cursor:pointer;
display:grid;place-items:center;transition:transform .2s,background .25s,color .25s,border-color .25s;position:relative;z-index:1}
.chk:active{transform:scale(.88)}
.done>.chk,.row.done .chk,.atk.done .chk{background:var(--teal);border-color:var(--teal);color:#06231C}
/* Secundarias y ataques */
.list{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.row{display:flex;gap:14px;align-items:center;background:var(--sf);border-radius:18px;padding:14px 16px}
.row .chk{width:34px;height:34px;font-size:1.05rem;border-width:2.5px;border-color:var(--mu)}
.row .t{flex:1;font-size:1.02rem}
.row .p{color:var(--mu);font-size:.8rem}
.row.done .t{text-decoration:line-through;opacity:.55}
.row.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.04)}}
/* Jefes */
.boss{background:var(--sf);border-radius:var(--r);padding:18px 16px 12px;margin-bottom:14px}
.boss h3{margin:0 0 2px;font-size:1.15rem;font-weight:800}
.hp{display:flex;gap:6px;margin:12px 0 14px}
.hp i{flex:1;height:12px;border-radius:6px;background:var(--coral);transition:background .4s,transform .3s}
.hp i.off{background:var(--sf2);transform:scaleY(.6)}
.boss .row{background:var(--sf2);padding:10px 12px;border-radius:14px}
.boss .row .chk{width:30px;height:30px;font-size:.95rem}
.boss.dead h3{color:var(--teal)}
.boss.dead h3::after{content:" derrotado"}
/* Loot */
.loot{background:var(--sf);border-radius:var(--r);padding:18px;display:flex;gap:16px;align-items:center}
.loot .cofre{font-size:2.2rem;transition:filter .5s,transform .5s}
.loot.lock{opacity:.55}
.loot.lock .cofre{filter:grayscale(1)}
.loot:not(.lock) .cofre{transform:rotate(-8deg) scale(1.1)}
.loot.hecho .t{text-decoration:line-through;opacity:.6}
.loot button{margin-left:auto;background:var(--amber);color:#2B1B00;border:0;border-radius:12px;padding:10px 14px;font:600 .9rem var(--f);cursor:pointer}
.loot.lock button{display:none}
.vacio{color:var(--mu);background:var(--sf);border-radius:var(--r);padding:20px;text-align:center}
main{padding-bottom:96px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);z-index:20}
nav button{flex:1;max-width:170px;background:var(--sf);color:var(--mu);border:0;border-radius:16px;padding:12px 8px;font:600 .95rem var(--f);cursor:pointer}
nav button.on{background:var(--amber);color:#2B1B00}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h h3{margin:0;font-size:1.3rem;font-weight:800;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{text-align:center;color:var(--mu);font-size:.75rem;padding:4px 0}
.cal button{aspect-ratio:1;background:var(--sf);color:var(--tx);border:0;border-radius:12px;font:600 .95rem var(--f);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cal button.hoy{box-shadow:inset 0 0 0 2px var(--amber)}
.cal button.sel{background:var(--sf2)}
.cal .vac{visibility:hidden}
.dots{display:flex;gap:3px;height:6px}
.dots b{width:6px;height:6px;border-radius:50%}
.dots .p{background:var(--amber)}.dots .d{background:var(--teal)}
.copy{display:block;width:100%;text-align:left;text-decoration:none;background:var(--sf);color:var(--tx);border:0;border-radius:18px;padding:14px 16px;margin-bottom:10px;font:400 .95rem var(--f);cursor:pointer}
.copy b{display:block;margin-bottom:4px}
.copy span{color:var(--mu);font-size:.85rem}
:root{--c-proyecto:#A78BFA;--c-compras:#38BDF8;--c-casa:#A3E635;--c-trabajo:#F472B6;--c-movimiento:#FB923C}
@media (prefers-color-scheme:light){:root{--c-proyecto:#7C5CE0;--c-compras:#0E86C7;--c-casa:#5E9A00;--c-trabajo:#D6338A;--c-movimiento:#C2570C}}
.row{box-shadow:inset 5px 0 0 var(--cat,transparent)}
.main .p{font-size:.82rem;margin-top:6px}
.leyenda{display:flex;flex-wrap:nowrap;gap:4px;margin:-8px -16px 16px;padding:0 40px 0 12px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}
.leyenda::-webkit-scrollbar{display:none}
.leyenda button{flex:none;background:transparent;color:var(--mu);border:0;border-radius:999px;padding:9px 11px;font:600 .82rem var(--f);cursor:pointer;transition:opacity .2s,color .2s}
.leyenda i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.leyenda button[aria-pressed=true]{color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--c)}
.leyenda.f button[aria-pressed=false]{opacity:.5}
/* Confeti de chispas */
.sp{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:50;animation:sp .8s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.sp{display:none}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Misiones</h1><div class="fecha" id="fecha"></div></div>
  <button class="ico" id="ref" aria-label="Actualizar misiones" title="Actualizar">↻</button>
</header>
<div id="aviso"></div>
<div class="leyenda" id="ley"></div>
<div id="v-hoy"><section aria-label="Misión principal"><div id="main"></div></section>
<h2>Misiones secundarias</h2>
<ul class="list" id="sec"></ul>
<h2>Batallas contra jefes</h2>
<div id="jefes"></div>
<h2>Loot</h2>
<div id="loot"></div></div>
<div id="v-cal" hidden>
  <div class="cal-h"><button class="ico" data-mes="-1" aria-label="Mes anterior">‹</button><h3 id="cal-t"></h3><button class="ico" data-mes="1" aria-label="Mes siguiente">›</button></div>
  <div class="cal" id="cal"></div>
  <h2 id="dia-t"></h2>
  <ul class="list" id="dialist"></ul>
</div>
<div id="v-ag" hidden>
  <h2>Pedile al agente</h2>
  <div class="aviso">Las misiones se crean y se cambian desde tu chat con Spark. Tocá un atajo para copiarlo y pegalo allá.</div>
  <div id="atajos"></div>
</div>
</main>
<nav aria-label="Secciones"><button data-tab="hoy" class="on">Hoy</button><button data-tab="cal">Calendario</button><button data-tab="ag">Agente</button></nav>
<script>
// ====== CONFIGURACIÓN ======
// Pegá acá el link CSV de tu hoja (Archivo > Compartir > Publicar en la web > CSV).
// Si queda vacío, se muestran datos de ejemplo.
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTyrzvdBdEgR50JyboJMpmgxc93LTQLwEvRrAI8lVZ8IhABBy573hms_-fi8WtbNm5jOQdWw5iLmdz5/pub?gid=0&single=true&output=csv";
// ===========================

const pad=n=>String(n).padStart(2,"0");
const D=new Date(), HOY=`${D.getFullYear()}-${pad(D.getMonth()+1)}-${pad(D.getDate())}`;
const dia=n=>{const x=new Date(D.getFullYear(),D.getMonth(),D.getDate()+n);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`};
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const CAT={proyecto:"Proyectos",compras:"Compras",casa:"Casa",trabajo:"Trabajo",movimiento:"Movimiento"};
const etq=(m,L=1)=>{const a=L&&CAT[m.categoria]?`<span style="color:var(--c-${m.categoria});font-weight:600">${CAT[m.categoria]}</span>`:"";const b=[m.hora,m.proyecto].filter(Boolean).map(esc).join(", ");return a||b?`<div class="p">${a}${a&&b?", ":""}${b}</div>`:""};
let filtro=new Set();
const vis=m=>!filtro.size||filtro.has(m.categoria);
function pintaLey(){const l=$("ley");l.classList.toggle("f",filtro.size>0);
 l.innerHTML=Object.entries(CAT).map(([k,v])=>`<button data-cat="${k}" aria-pressed="${filtro.has(k)}" style="--c:var(--c-${k})"><i style="background:var(--c-${k})"></i>${v}</button>`).join("")}
pintaLey();

const DEMO=`id,tipo,titulo,fecha,estado,proyecto,jefe_id,notas,hecha_el,categoria,hora
m1,principal,Armar la mochila de camping,${HOY},pendiente,Camping,,Carpa y bolsa de dormir,,proyecto
s1,secundaria,Comprar pilas y repelente,${HOY},pendiente,,,,,compras
s2,secundaria,Pagar la boleta de internet,${HOY},hecha,,,,${HOY},casa
w1,secundaria,Preparar el material de la clase,${HOY},pendiente,Curso 2A,,,,trabajo,08:00
j1,jefe,Cambiar el filtro de aceite,,pendiente,Auto,,,,casa
a1,ataque,Mirar el tutorial y anotar herramientas,,hecha,Auto,j1,,,casa
a2,ataque,Comprar filtro y aceite,,pendiente,Auto,j1,,,casa
a3,ataque,Hacer el cambio,,pendiente,Auto,j1,,,casa
l1,loot,Una hora de play sin culpa,,disponible,,,,,
p1,secundaria,Llevar el auto a verificar,${dia(1)},pendiente,Auto,,,,casa
p2,principal,Escribir dos páginas del cuento,${dia(2)},pendiente,Escritura,,,,proyecto
w2,secundaria,Entregar la planificación del trimestre,${dia(3)},pendiente,Curso 2A,,,,trabajo
h1,principal,Ordenar el escritorio,${dia(-1)},hecha,,,,${dia(-1)},casa
h2,secundaria,Comprar yerba,${dia(-2)},hecha,,,,${dia(-2)},compras`;

function parseCSV(t){const rows=[];let r=[],c="",q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;
  else if(ch==","){r.push(c);c=""}
  else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);rows.push(r);r=[];c=""}
  else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}
 const h=rows.shift().map(s=>s.trim().toLowerCase());
 return rows.filter(x=>x.length>1).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||"").trim()])))}

// Tildes locales (V1): se guardan solo en este celular.
let ovr={};try{ovr=JSON.parse(localStorage.getItem("md_ovr")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("md_ovr",JSON.stringify(ovr))}catch(e){}};
let data=[];
const est=m=>ovr[m.id+"@"+HOY]||ovr[m.id]||m.estado;
const hecha=m=>["hecha","canjeado"].includes(est(m));
const cuando=m=>ovr[m.id+"~"]||m.hecha_el;

function spark(el){
 const b=el.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2,cols=["#FFB547","#3DDBB4","#FF6B6B","#8FA8FF"];
 for(let i=0;i<14;i++){const s=document.createElement("span");s.className="sp";
  const a=Math.random()*6.28,d=40+Math.random()*60;
  s.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%4]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;
  document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}

function toggle(id,btn){
 const m=data.find(x=>x.id===id);if(!m)return;
 const nuevo=hecha(m)?(m.tipo==="loot"?"disponible":"pendiente"):(m.tipo==="loot"?"canjeado":"hecha");
 ovr[id]=nuevo;if(nuevo==="hecha")ovr[id+"~"]=HOY;else delete ovr[id+"~"];save();
 if(nuevo==="hecha"||nuevo==="canjeado")spark(btn);
 render();}

const fila=(m,extra="")=>`<li class="row ${hecha(m)?"done":""}" style="--cat:var(--c-${esc(m.categoria)},transparent)"><button class="chk" data-id="${esc(m.id)}" aria-label="Marcar ${esc(m.titulo)}">✓</button>
<div class="t">${esc(m.titulo)}${etq(m,0)}</div></li>`;

function render(){
 $("fecha").textContent=D.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
 const delDia=m=>(!m.fecha||m.fecha===HOY)&&est(m)!=="descartada"&&vis(m);
 // Principal
 const p=data.find(m=>m.tipo==="principal"&&delDia(m));
 $("main").innerHTML=p?`<div class="main ${hecha(p)?"done":""}"><button class="chk" data-id="${esc(p.id)}" aria-label="Completar misión principal">✓</button>
 <div><h3>${esc(p.titulo)}</h3>${etq(p)}<div class="sub">${hecha(p)?"Misión cumplida. El día ya fue un éxito.":esc(p.notas||"Una sola cosa. Si sale esta, el día ganó.")}</div></div></div>`
 :`<div class="vacio">Todavía no hay misión principal para hoy.<br>Pedile el briefing matutino al agente.</div>`;
 // Secundarias
 const sec=data.filter(m=>m.tipo==="secundaria"&&delDia(m));
 $("sec").innerHTML=sec.length?sec.map(m=>fila(m)).join(""):`<div class="vacio">Sin mandados por hoy.</div>`;
 // Jefes
 const jefes=data.filter(m=>m.tipo==="jefe"&&est(m)!=="descartada"&&vis(m));
 $("jefes").innerHTML=jefes.length?jefes.map(j=>{
  const at=data.filter(a=>a.tipo==="ataque"&&a.jefe_id===j.id).slice(0,3);
  const vivos=at.filter(a=>!hecha(a)).length;
  return `<div class="boss ${at.length&&!vivos?"dead":""}"><h3>${esc(j.titulo)}</h3>
  <div class="p" style="color:var(--mu);font-size:.85rem">${vivos} de ${at.length} ataques para derrotarlo</div>
  <div class="hp">${at.map(a=>`<i class="${hecha(a)?"off":""}"></i>`).join("")}</div>
  <ul class="list">${at.map(a=>fila(a)).join("")}</ul></div>`}).join("")
  :`<div class="vacio">Ningún jefe a la vista.</div>`;
 // Loot
 const pm=data.find(m=>m.tipo==="principal"&&(!m.fecha||m.fecha===HOY)&&est(m)!=="descartada"),bloqueado=pm&&!hecha(pm);
 const lt=data.filter(m=>m.tipo==="loot");
 $("loot").innerHTML=lt.length?lt.map(l=>`<div class="loot ${bloqueado?"lock":""} ${hecha(l)?"hecho":""}"><div class="cofre">🧰</div>
  <div class="t">${esc(l.titulo)}<div class="p" style="color:var(--mu);font-size:.8rem">${bloqueado?"Se abre al cumplir la misión principal":hecha(l)?"Disfrutado":"Te lo ganaste"}</div></div>
  ${hecha(l)?"":`<button data-id="${esc(l.id)}">Disfrutar</button>`}</div>`).join("")
  :`<div class="vacio">Sin recompensas cargadas.</div>`;
 renderCal();
}

document.addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)toggle(b.dataset.id,b)});

// ===== Calendario, pestañas y atajos =====
let mes=new Date(D.getFullYear(),D.getMonth(),1),sel=HOY;
const ATAJOS=[
 ["Briefing de hoy","Hacé el briefing matutino: definí mi Misión Principal y hasta 3 secundarias para hoy, y actualizá la hoja «misiones»."],
 ["Sumar una misión","Sumá a la hoja «misiones» una misión: [qué hacer], categoría [proyecto, compras, casa, trabajo o movimiento], para el [día]."],
 ["Armar un jefe","Convertí esta tarea postergada en un jefe con 3 ataques de menos de 10 minutos y cargalos en la hoja «misiones»: [tarea]."],
 ["Debriefing de la noche","Hacé el debriefing nocturno: pasá a hecha lo que cumplí (anotá la fecha en hecha_el), reubicá lo pendiente y dejá armada la Misión Principal de mañana."]];
const delDiaK=k=>data.filter(m=>m.tipo!=="loot"&&est(m)!=="descartada"&&vis(m)&&(m.fecha===k||(hecha(m)&&cuando(m)===k)));
function renderCal(){
 const y=mes.getFullYear(),mo=mes.getMonth(),n=new Date(y,mo+1,0).getDate(),ini=(mes.getDay()+6)%7;
 $("cal-t").textContent=mes.toLocaleDateString("es-AR",{month:"long",year:"numeric"});
 let h=["L","M","X","J","V","S","D"].map(d=>`<div class="dw">${d}</div>`).join("")+`<span class="vac"></span>`.repeat(ini);
 for(let d=1;d<=n;d++){const k=`${y}-${pad(mo+1)}-${pad(d)}`,it=delDiaK(k),pt=[...new Set(it.map(m=>m.categoria||"x"))].slice(0,4).map(c=>`<b style="background:var(--c-${c},var(--mu));opacity:${it.filter(m=>(m.categoria||"x")===c).every(hecha)?.35:1}"></b>`).join("");
  h+=`<button data-dia="${k}" class="${k===HOY?"hoy ":""}${k===sel?"sel":""}" aria-label="Día ${d}"><span>${d}</span><span class="dots">${pt}</span></button>`}
 $("cal").innerHTML=h;
 const [yy,mm,dd]=sel.split("-").map(Number),rel=sel===HOY?"hoy":sel>HOY?"por venir":"ya pasó";
 $("dia-t").textContent=new Date(yy,mm-1,dd).toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})+", "+rel;
 const it=delDiaK(sel);
 $("dialist").innerHTML=it.length?it.map(m=>fila(m)).join(""):`<div class="vacio">Sin misiones este día.</div>`;
}
function tab(t){["hoy","cal","ag"].forEach(x=>{$("v-"+x).hidden=x!==t});
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
 try{history.replaceState(null,"","#"+t)}catch(e){}scrollTo(0,0)}
$("atajos").innerHTML=ATAJOS.map((a,i)=>`<button class="copy" data-copy="${i}"><b>${a[0]}</b><span>${esc(a[1])}</span></button>`).join("")
 +`<a class="copy" href="https://gemini.google.com" target="_blank" rel="noopener"><b>Abrir Gemini</b></a>`;
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-tab],[data-dia],[data-mes],[data-copy],[data-cat]");if(!t)return;
 if(t.dataset.tab)tab(t.dataset.tab);
 else if(t.dataset.dia){sel=t.dataset.dia;renderCal()}
 else if(t.dataset.mes){mes=new Date(mes.getFullYear(),mes.getMonth()+Number(t.dataset.mes),1);renderCal()}
